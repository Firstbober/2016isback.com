<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2016isback.com | Daily Retro Radio</title>
    <link rel="stylesheet" href="css/style.css">
    <meta property="og:title" content="2016isback.com">
    <meta property="og:description" content="A daily radio station playing hits from exactly 10 years ago.">
    <meta property="og:type" content="website">
</head>
<body>

    <header>
        <h1>2016 IS BACK <span>LIVE</span></h1>
        <div id="current-date" class="date-ticker">Broadcasting from 2016...</div>
    </header>

    <main>
        <div class="selector-container">
            <div class="segmented-control">
                <button id="btn-pl">POLAND</button>
                <button id="btn-world" class="active">USA / WORLD</button>
            </div>
        </div>

        <div class="radio-player">
            <div class="player-card">
                <div class="card-header">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="YouTube" class="platform-icon">
                    <h2>Live Radio</h2>
                    <div id="now-playing" class="now-playing"></div>
                </div>
                <div id="youtube-player"></div>
                <div class="player-controls">
                    <button id="btn-play-pause" class="control-btn">
                        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <div class="time-display">
                        <span id="current-time"></span>
                        <span id="song-progress"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>Created by <a href="https://x.com/firstbober" target="_blank" rel="noopener noreferrer">@firstbober</a></p>
        <p style="font-size: 0.7rem; margin-top: 10px; opacity: 0.5;">&copy; We're back to 2016!!!!!</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
